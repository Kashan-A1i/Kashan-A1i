    <rect x="447" y="28" width="73" height="22" rx="11" fill="#fbfaf7" stroke="#2c2e33" stroke-width="1"/>
    <text x="483.5" y="42.8" text-anchor="middle" class="mono-pill">Supabase</text>
  <text x="296" y="74.0" class="sans-body" font-size="12">Full-stack regional song archive serving 3,000+ visitors</text>
  <text x="296" y="91.5" class="sans-body" font-size="12">with real-time updates and clean UI design.</text>

