<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 136" width="900" height="136" role="img" aria-label="BASHONU — Cultural Music Preservation">
  <style>
    .serif-display {
      font-family: Georgia, 'Times New Roman', Times, serif;
