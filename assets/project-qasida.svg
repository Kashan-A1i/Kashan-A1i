<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 132" width="900" height="132" role="img" aria-label="QASIDA — Media Archival &amp; OCR Platform">
  <style>
    .serif-display {
      font-family: Georgia, 'Times New Roman', Times, serif;
      fill: #1c1d1f;
    }
    .serif-italic {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-style: italic;
      fill: #52555a;
    }
    .serif-paper {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-style: italic;
      fill: #1c1d1f;
    }
    .section-heading {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.4px;
      fill: #1c1d1f;
    }
    .mono-index {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 0.8px;
      fill: #52555a;
    }
    .mono-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      fill: #1c1d1f;
    }
    .sans-body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 12.2px;
      fill: #52555a;
    }
    .sans-strong {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 12.2px;
      font-weight: 600;
      fill: #1c1d1f;
    }
    @keyframes calmPulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.45; }
    }
    .status-live {
      animation: calmPulse 4.2s ease-in-out infinite;
    }
  </style>
  <!-- Stone-white monograph surface -->
  <rect width="900" height="132" fill="#f7f6f2"/>

  <!-- Horizontal Catalog Card -->
  <rect x="28" y="4" width="844" height="124" rx="6" fill="#fbfaf7" stroke="#d8d5ce" stroke-width="1"/>

  <!-- Zone 1 (Left ~30%): Title, Subtitle & Metric -->
  <text x="48" y="32" class="mono-index" font-size="10">SPECIMEN 02.2</text>
  <text x="48" y="57" class="serif-display" font-size="15.5" font-weight="bold" letter-spacing="0.6">QASIDA</text>
  <text x="48" y="78" class="serif-italic" font-size="12.8">Media Archival &amp; OCR Platform</text>
  <text x="48" y="107" class="mono-index" font-size="10.2">Multilingual OCR · Hypermedia</text>

  <!-- Hairline Zone Dividers -->
  <line x1="276.5" y1="22" x2="276.5" y2="110" stroke="#e5e2dc" stroke-width="1"/>
  <line x1="708.5" y1="22" x2="708.5" y2="110" stroke="#e5e2dc" stroke-width="1"/>

  <!-- Zone 2 (Middle ~50%): Monochrome Outline Pills & Summary -->
    <rect x="296" y="28" width="60" height="22" rx="11" fill="#fbfaf7" stroke="#2c2e33" stroke-width="1"/>
    <text x="326.0" y="42.8" text-anchor="middle" class="mono-pill">Django</text>
    <rect x="362" y="28" width="47" height="22" rx="11" fill="#fbfaf7" stroke="#2c2e33" stroke-width="1"/>
    <text x="385.5" y="42.8" text-anchor="middle" class="mono-pill">HTMX</text>
    <rect x="415" y="28" width="86" height="22" rx="11" fill="#fbfaf7" stroke="#2c2e33" stroke-width="1"/>
    <text x="458.0" y="42.8" text-anchor="middle" class="mono-pill">PostgreSQL</text>
    <rect x="507" y="28" width="100" height="22" rx="11" fill="#fbfaf7" stroke="#2c2e33" stroke-width="1"/>
    <text x="557.0" y="42.8" text-anchor="middle" class="mono-pill">OCR Pipeline</text>
  <text x="296" y="74.0" class="sans-body" font-size="12">Multilingual poetic media platform with an automated background</text>
  <text x="296" y="91.5" class="sans-body" font-size="12">OCR ingestion pipeline and low-latency hypermedia search.</text>

  <!-- Zone 3 (Right ~20%): Fine-Line Monochrome Technical Illustration -->
  <g transform="translate(790, 66.0)" stroke="#2c2e33" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-50" y="-32" width="100" height="64" rx="4" stroke-width="1.15" fill="#fbfaf7"/>
    <path d="M -43,-25 L 43,-25 L 43,12 L -43,12 Z" stroke-width="0.85"/>
    <line x1="-43" y1="-16" x2="43" y2="-16" stroke-width="0.75" opacity="0.75"/>
    <circle cx="-45" cy="-27" r="1.1" stroke-width="0.8"/>
    <circle cx="45" cy="-27" r="1.1" stroke-width="0.8"/>
    <circle cx="-45" cy="27" r="1.1" stroke-width="0.8"/>
    <circle cx="45" cy="27" r="1.1" stroke-width="0.8"/>
    <rect x="-31" y="-10" width="62" height="17" rx="8.5" stroke-width="0.95" fill="#f7f6f2"/>
    <rect x="-11" y="-6" width="22" height="9" stroke-width="0.75" fill="#fbfaf7"/>
    <line x1="-6" y1="-1.5" x2="-6" y2="1.5" stroke-width="0.7"/>
    <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke-width="0.7"/>
    <line x1="6" y1="-1.5" x2="6" y2="1.5" stroke-width="0.7"/>
    <circle cx="-21" cy="-1.5" r="6" fill="#fbfaf7" stroke-width="1"/>
    <circle cx="-21" cy="-1.5" r="2.2" stroke-width="0.8"/>
    <line x1="-21" y1="-7.5" x2="-21" y2="-4.5" stroke-width="0.8"/>
    <line x1="-26.2" y1="1.5" x2="-23.6" y2="0" stroke-width="0.8"/>
    <line x1="-15.8" y1="1.5" x2="-18.4" y2="0" stroke-width="0.8"/>
    <circle cx="21" cy="-1.5" r="6" fill="#fbfaf7" stroke-width="1"/>
    <circle cx="21" cy="-1.5" r="2.2" stroke-width="0.8"/>
    <line x1="21" y1="-7.5" x2="21" y2="-4.5" stroke-width="0.8"/>
    <line x1="15.8" y1="1.5" x2="18.4" y2="0" stroke-width="0.8"/>
    <line x1="26.2" y1="1.5" x2="23.6" y2="0" stroke-width="0.8"/>
    <path d="M -32,32 L -26,18 L 26,18 L 32,32" stroke-width="1"/>
    <circle cx="-15" cy="25.5" r="1.8" stroke-width="0.85"/>
    <circle cx="15" cy="25.5" r="1.8" stroke-width="0.85"/>
    <circle cx="-7" cy="27" r="1.1" stroke-width="0.75"/>
    <circle cx="7" cy="27" r="1.1" stroke-width="0.75"/>
  </g>
</svg>
