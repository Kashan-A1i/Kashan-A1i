<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="900" height="176" role="img" aria-label="POSHEEDA VIRSA — 3D Virtual Heritage Tour">
  <style>
    .serif-display {
      font-family: Georgia, 'Times New Roman', Times, serif;
      fill: #1c1d1f;
    }
    .serif-italic {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-style: italic;
      fill: #52555a;
    }
    .serif-paper {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-style: italic;
      fill: #1c1d1f;
    }
    .section-heading {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.4px;
      fill: #1c1d1f;
    }
    .mono-index {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 0.8px;
      fill: #52555a;
    }
    .mono-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      fill: #1c1d1f;
    }
    .sans-body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 12.2px;
      fill: #52555a;
    }
    .sans-strong {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 12.2px;
      font-weight: 600;
      fill: #1c1d1f;
    }
    @keyframes calmPulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.45; }
    }
    .status-live {
      animation: calmPulse 4.2s ease-in-out infinite;
    }
  </style>
  <!-- Stone-white monograph surface -->
  <rect width="900" height="176" fill="#f7f6f2"/>

  <!-- Section Header -->
  <text x="28" y="26" class="mono-index" font-size="11" fill="#52555a">02</text>
  <text x="52" y="26" class="section-heading">SELECTED PROJECTS: 3D VISION &amp; CULTURAL ARCHIVES</text>
  <line x1="498" y1="22" x2="856" y2="22" stroke="#e5e2dc" stroke-width="1"/>
  <circle cx="869" cy="22" r="2.5" fill="#c87d65"/>
  <!-- Horizontal Catalog Card -->
  <rect x="28" y="40" width="844" height="132" rx="6" fill="#fbfaf7" stroke="#d8d5ce" stroke-width="1"/>

  <!-- Zone 1 (Left ~30%): Title, Subtitle & Metric -->
  <text x="48" y="68" class="mono-index" font-size="10">SPECIMEN 02.1</text>
  <text x="48" y="93" class="serif-display" font-size="15.5" font-weight="bold" letter-spacing="0.6">POSHEEDA VIRSA</text>
  <text x="48" y="114" class="serif-italic" font-size="12.8">3D Virtual Heritage Tour</text>
  <circle cx="51" cy="139.5" r="2.2" fill="#7a9181" class="status-live"/>
  <text x="59" y="143" class="mono-index" font-size="10.2">In Progress · Cultural Sites</text>

  <!-- Hairline Zone Dividers -->
  <line x1="276.5" y1="58" x2="276.5" y2="154" stroke="#e5e2dc" stroke-width="1"/>
  <line x1="708.5" y1="58" x2="708.5" y2="154" stroke="#e5e2dc" stroke-width="1"/>

  <!-- Zone 2 (Middle ~50%): Monochrome Outline Pills & Summary -->
    <rect x="296" y="59" width="140" height="22" rx="11" fill="#fbfaf7" stroke="#2c2e33" stroke-width="1"/>
    <text x="366.0" y="73.8" text-anchor="middle" class="mono-pill">3D Computer Vision</text>
    <rect x="442" y="59" width="60" height="22" rx="11" fill="#fbfaf7" stroke="#2c2e33" stroke-width="1"/>
    <text x="472.0" y="73.8" text-anchor="middle" class="mono-pill">Python</text>
    <rect x="508" y="59" width="60" height="22" rx="11" fill="#fbfaf7" stroke="#2c2e33" stroke-width="1"/>
    <text x="538.0" y="73.8" text-anchor="middle" class="mono-pill">OpenCV</text>
    <rect x="574" y="59" width="60" height="22" rx="11" fill="#fbfaf7" stroke="#2c2e33" stroke-width="1"/>
    <text x="604.0" y="73.8" text-anchor="middle" class="mono-pill">COLMAP</text>
    <rect x="296" y="87" width="160" height="22" rx="11" fill="#fbfaf7" stroke="#2c2e33" stroke-width="1"/>
    <text x="376.0" y="101.8" text-anchor="middle" class="mono-pill">3D Gaussian Splatting</text>
  <text x="296" y="129.0" class="sans-body" font-size="12">End-to-end 3D reconstruction pipeline converting photography</text>
  <text x="296" y="146.5" class="sans-body" font-size="12">into interactive walkthroughs of endangered cultural sites.</text>

  <!-- Zone 3 (Right ~20%): Fine-Line Monochrome Technical Illustration -->
  <g transform="translate(790, 108.0)" stroke="#2c2e33" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Orthographic photogrammetry base grid -->
    <polygon points="-52,36 -30,24 30,24 52,36" stroke="#d8d5ce" stroke-width="0.9"/>
    <line x1="-41" y1="30" x2="41" y2="30" stroke="#e5e2dc" stroke-width="0.8"/>
    <line x1="0" y1="24" x2="0" y2="36" stroke="#e5e2dc" stroke-width="0.8"/>
    <!-- Outer architectural frame pillars -->
    <rect x="-38" y="-32" width="76" height="62" stroke-width="1.1"/>
    <line x1="-38" y1="-24" x2="38" y2="-24" stroke-width="0.8"/>
    <!-- Heritage pointed arch outer & inner extrados -->
    <path d="M -28,30 L -28,1 Q -28,-18 0,-22 Q 28,-18 28,1 L 28,30" stroke-width="1.15"/>
    <path d="M -20,30 L -20,3 Q -20,-11 0,-15 Q 20,-11 20,3 L 20,30" stroke-width="0.9"/>
    <!-- Wireframe vault ribs & 3D reconstruction rays -->
    <path d="M -28,1 Q -10,-7 0,-15 Q 10,-7 28,1" stroke-width="0.8" opacity="0.8"/>
    <path d="M -20,3 Q 0,-3 20,3" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
    <line x1="0" y1="-32" x2="0" y2="30" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
    <line x1="-28" y1="30" x2="-20" y2="30" stroke-width="1.1"/>
    <line x1="20" y1="30" x2="28" y2="30" stroke-width="1.1"/>
    <!-- Crown wireframe cupola dome (peaks at y=-41) & attached finial -->
    <path d="M -18,-32 Q 0,-50 18,-32" stroke-width="1.05"/>
    <path d="M -9,-32 Q 0,-49 9,-32" stroke-width="0.75"/>
    <line x1="0" y1="-41" x2="0" y2="-46" stroke-width="0.95"/>
    <!-- Photogrammetry feature keypoints -->
    <circle cx="0" cy="-22" r="1.4" fill="#fbfaf7" stroke="#2c2e33" stroke-width="0.9"/>
    <circle cx="-28" cy="1" r="1.3" fill="#fbfaf7" stroke="#2c2e33" stroke-width="0.9"/>
    <circle cx="28" cy="1" r="1.3" fill="#fbfaf7" stroke="#2c2e33" stroke-width="0.9"/>
  </g>
</svg>
