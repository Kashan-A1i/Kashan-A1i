  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #1c1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 36px 24px 56px;
      -webkit-font-smoothing: antialiased;
    }

    /* Realistic GitHub Profile README Light-Mode Frame (896px max-width) */
    .github-readme-shell {
      max-width: 896px;
      margin: 0 auto;
      border: 1px solid #d8d5ce;
      border-radius: 6px;
      background-color: #f7f6f2;
      overflow: hidden;
    }

    .github-readme-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background-color: #fbfaf7;
      border-bottom: 1px solid #d8d5ce;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: #52555a;
    }

    .github-readme-topbar strong {
      color: #1c1d1f;
      font-weight: 600;
    }

    .monograph-canvas {
      background-color: #f7f6f2;
      padding: 12px 0 22px;
    }

    .svg-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .svg-stack a,
    .svg-stack img {
      display: block;
      width: 100%;
      height: auto;
      text-decoration: none;
    }

    .svg-stack a {
      transition: opacity 0.18s ease;
    }

    .svg-stack a:hover {
      opacity: 0.92;
    }

    .colophon {
      margin-top: 14px;
      padding-top: 14px;
      margin-left: 28px;
      margin-right: 28px;
      border-top: 1px solid #d8d5ce;
      text-align: center;
      line-height: 1.85;
    }

    .colophon code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 0.9px;
      color: #52555a;
      background: transparent;
    }

    .colophon .links {
      font-size: 12px;
      color: #52555a;
    }

    .colophon a {
      color: #1c1d1f;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid #d8d5ce;
      padding-bottom: 1px;
    }

    .colophon a:hover {
      border-bottom-color: #1c1d1f;
    }
  </style>
</head>
